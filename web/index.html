<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <!-- Document content is untrusted: no inline script, no network fetches, no plugins. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src 'self' file: data: blob: https: http:; font-src 'self' file: data: brfont:; media-src 'self' file: data: blob:; connect-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>BabyReader</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="is-welcome">
  <!-- Top bar: app name + file info + mode toggle -->
  <div class="topbar" id="topbar">
    <div class="topbar-left">
      <button class="toc-toggle" id="btnToc" type="button" hidden aria-label="显示目录" title="显示目录"></button>
      <span class="app-name">BabyReader</span>
      <span class="file-name" id="fileName"></span>
    </div>
    <div class="topbar-right">
      <button class="reader-tool-btn open-btn" id="btnOpen" type="button" aria-label="打开文件" title="打开文件"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"></path></svg></button>
      <button class="reader-tool-btn" id="btnHighlight" type="button" hidden aria-label="划线" title="划线"></button>
      <button class="reader-tool-btn" id="btnExportHighlights" type="button" hidden aria-label="导出划线" title="导出划线"></button>
      <button class="theme-btn" id="btnTheme" type="button" aria-label="切换浅色模式" title="切换浅色模式"></button>
      <button class="mode-btn active" id="btnRead" type="button">阅读</button>
      <button class="mode-btn" id="btnEdit" type="button">编辑</button>
    </div>
  </div>

  <!-- Reader view -->
  <div class="reader is-welcome" id="reader">
    <div class="article" id="article">
      <!-- Welcome state -->
      <div class="welcome" id="welcome">
        <h1>BabyReader</h1>
        <p class="welcome-quote-en">To acquire the habit of reading is to construct for yourself<br>a refuge from almost all the miseries of life.</p>
        <p class="welcome-quote-zh">阅读是一座随身携带的避难所。</p>
        <p class="hint" id="welcomeHint">⌘O 打开文件 · 支持 .md .txt .epub · 双击直接阅读</p>
        <p class="credit">by <a href="https://x.com/KingJing001" target="_blank">@一龙小包子</a></p>
      </div>
    </div>
    <div class="epub-shell" id="epubShell" style="display:none">
      <div class="epub-viewer" id="epubViewer"></div>
    </div>
  </div>

  <!-- Editor view (hidden by default) -->
  <div class="editor-container" id="editorContainer" style="display:none">
    <div class="editor-pane">
      <textarea class="editor" id="editor" spellcheck="false"></textarea>
    </div>
    <div class="preview-pane">
      <div class="article" id="preview"></div>
    </div>
  </div>

  <script src="lib/jszip.min.js"></script>
  <script src="lib/epub.min.js"></script>
  <script src="lib/marked.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
